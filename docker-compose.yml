services:
  nginx:
    image: nginx:1.22
    ports:
      - 8190:80
    volumes:
      - ./deploy/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
  mysql:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: ImOxO8Lz
      MYSQL_DATABASE: xtreme1
      MYSQL_USER: xtreme1
      MYSQL_PASSWORD: Rc4K3L6f
    ports:
      - 8191:3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./deploy/mysql/custom.cnf:/etc/mysql/conf.d/custom.cnf
      - ./deploy/mysql/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: '/usr/bin/mysql --user=xtreme1 --password=Rc4K3L6f --execute "SHOW DATABASES;"'
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  redis:
    image: redis:6.2
    ports:
      - 8192:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  minio:
    image: bitnamilegacy/minio:2022.9.1
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: 1tQB970y
      MINIO_DEFAULT_BUCKETS: xtreme1:download
    ports:
      - 8193:9000
      - 8194:9001
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "-f",
          "http://minio:9000/minio/health/ready"
        ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 10
  backend:
    # By default, Compose will pull image from Docker Hub when no local image found.
    # image: basicai/xtreme1-backend:v0.9.1
    # pull_policy: always
    # Uncomment this line and comment previous line to build image locally, not pull from Docker Hub.
    build: ./backend
    ports:
      - 8290:8080
    volumes:
    # Using customized application.yml to override default configs.
    #   - /host/path/to/customized/application.yml:/app/config/application.yml
      - /home/a/dataset_custom/zenix_dataset/dataset_0124:/app/data/zenix_snow
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--silent",
          "-f",
          "http://backend:8080/actuator/health"
        ]
      interval: 10s
      timeout: 10s
      start_period: 10s
      retries: 30
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
  frontend:
    # By default, Compose will pull image from Docker Hub when no local image found.
    # image: basicai/xtreme1-frontend:v0.9.1
    # pull_policy: always
    # Uncomment this line and comment previous line to build image locally, not pull from Docker Hub.
    build: ./frontend
    ports:
      - 8291:80
  pcd-tools:
    image: basicai/xtreme1-pcd-tools
    pull_policy: always
    ports:
      - 8296:5000
  image-vect-visualization:
    image: basicai/xtreme1-image-vect-visualization
    pull_policy: always
    ports:
      - 8294:5000
  image-object-detection:
    image: basicai/xtreme1-image-object-detection
    pull_policy: always
    ports:
      - 8292:5000
    # You need to explicitly specify model profile to start this service.
    profiles:
      - model
    runtime: nvidia
  point-cloud-object-detection:
    image: kanghanbin/my-custom-xtreme1:v5  # <--- v5로 변경
    ports:
      - 8293:5000
    # You need to explicitly specify model profile to start this service.
    profiles:
      - model
    runtime: nvidia
    shm_size: '8gb'
    
    # [▼ 아래 두 줄을 꼭 추가해주세요!]
    working_dir: /app/pcdet_open
    # app.py 마운트: intensity 0~2 저반사(눈 노이즈) 필터 + --model 프리셋(centerpoint/transfusion/voxelnext, full_nms 자동 감지)
    volumes:
      - ./deploy/point-cloud-detection/app.py:/app/pcdet_open/app.py:ro
      - ./deploy/point-cloud-detection/predictor.py:/app/pcdet_open/src/predictor.py:ro
      - ./cbgs_transfusion_lidar.pth:/app/cbgs_transfusion_lidar.pth:ro
      - ./cbgs_voxel0075_voxelnext.pth:/app/cbgs_voxel0075_voxelnext.pth:ro
      # 파인튜닝(zenix CenterPoint, 단일 카메라 FOV ±50°, intensity raw/255) ckpt + cfg
      - ./centerpoint_zenix_ft.pth:/app/centerpoint_zenix_ft.pth:ro
      - ./training/cfgs/centerpoint_zenix.yaml:/app/pcdet_open/cfgs/zenix_models/centerpoint_zenix.yaml:ro
      - ./training/cfgs/zenix_dataset.yaml:/app/pcdet_open/cfgs/dataset_configs/zenix_dataset.yaml:ro
      - ./voxelnext_zenix_ft.pth:/app/voxelnext_zenix_ft.pth:ro
      - ./training/cfgs/voxelnext_zenix.yaml:/app/pcdet_open/cfgs/zenix_models/voxelnext_zenix.yaml:ro
      # 실내 보행자 PointPillars (JRDB pretrain + Caterpie 실내 finetune, 1클래스, raw intensity)
      - ./pointpillar_caterpie_ft.pth:/app/pointpillar_caterpie_ft.pth:ro
      - ./training/cfgs/pointpillar_caterpie.yaml:/app/pcdet_open/cfgs/custom_models/pointpillar_caterpie.yaml:ro
    # 이 서비스(8293, DB model id=1) = Zenix VoxelNeXt (실외, intensity raw/255, 저반사 필터 ON)
    environment:
      - INTENSITY_NORM=fixed255
    # 모델 변경: --model centerpoint | transfusion | voxelnext, 커스텀은 --cfg/--ckpt
    entrypoint: ["python", "app.py", "--cfg", "cfgs/zenix_models/voxelnext_zenix.yaml", "--ckpt", "/app/voxelnext_zenix_ft.pth"]

  # ── 실내 보행자 PointPillars (Caterpie) — 별도 컨테이너/포트(8296)로 Zenix와 동시 운용 ──
  # DB model "Caterpie" 의 url = http://point-cloud-object-detection-caterpie:5000/pointCloud/recognition
  point-cloud-object-detection-caterpie:
    image: kanghanbin/my-custom-xtreme1:v5
    ports:
      - 8296:5000
    # ponytail: 부하 문제로 기본 model 프로필에서 분리, 필요 시 --profile model-caterpie 로만 기동
    profiles:
      - model-caterpie
    runtime: nvidia
    shm_size: '8gb'
    working_dir: /app/pcdet_open
    volumes:
      - ./deploy/point-cloud-detection/app.py:/app/pcdet_open/app.py:ro
      - ./deploy/point-cloud-detection/predictor.py:/app/pcdet_open/src/predictor.py:ro
      - ./pointpillar_caterpie_ft.pth:/app/pointpillar_caterpie_ft.pth:ro
      - ./training/cfgs/pointpillar_caterpie.yaml:/app/pcdet_open/cfgs/custom_models/pointpillar_caterpie.yaml:ro
    # Caterpie: 학습이 raw intensity라 raw 통과 + 실내라 저반사(눈노이즈) 필터 OFF
    environment:
      - INTENSITY_NORM=raw
      - LOW_INTENSITY_FILTER=off
    entrypoint: ["python", "app.py", "--cfg", "cfgs/custom_models/pointpillar_caterpie.yaml", "--ckpt", "/app/pointpillar_caterpie_ft.pth"]
volumes:
  mysql-data:
  redis-data:
  minio-data:
