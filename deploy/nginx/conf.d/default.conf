server {
    listen       80;
    server_name  _;

    # For proxy MinIO requests
    ignore_invalid_headers off;
    client_max_body_size 1048576m;
    proxy_buffering off;

    # Docker 내장 DNS. proxy_pass 에 호스트명을 리터럴로 적으면 nginx 가 기동 시
    # 딱 한 번만 해석하고 그 IP 를 프로세스 수명 내내 고정한다. 그래서 backend/
    # frontend 컨테이너를 재배포해 IP 가 바뀌면 nginx 는 죽은 주소로 계속 붙고
    # 502 가 난다(nginx 를 같이 재시작하기 전까지). proxy_pass 에 변수를 쓰면
    # 요청 시점에 이 resolver 로 다시 해석하므로 재배포와 무관해진다.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 변수를 쓰는 proxy_pass 는 location 접두어 치환을 하지 않는다.
    # 따라서 경로를 갈아끼우던 블록은 rewrite ... break 로 같은 매핑을 재현한다.
    location / {
        set $no_cache 0;
        if ($uri ~* ^/$) {
            set $no_cache 1;
        }
        if ($uri ~* \.(?:html|json)$) {
            set $no_cache 1;
        }
        if ($no_cache = 1) {
            add_header Cache-Control "no-store,no-cache";
            add_header Pragma "no-cache";
        }

        set $upstream_frontend frontend:80;
        rewrite ^/(.*)$ /main/$1 break;
        proxy_pass   http://$upstream_frontend;
    }

    location /tool/image {
        set $no_cache 0;
        if ($uri ~* ^/tool/image[/]?$) {
            set $no_cache 1;
        }
        if ($uri ~* \.(?:html|json)$) {
            set $no_cache 1;
        }
        if ($no_cache = 1) {
            add_header Cache-Control "no-store,no-cache";
            add_header Pragma "no-cache";
        }

        set $upstream_frontend frontend:80;
        rewrite ^/tool/image(.*)$ /image-tool/$1 break;
        proxy_pass   http://$upstream_frontend;
    }

    location /tool/pc {
        set $no_cache 0;
        if ($uri ~* ^/tool/pc[/]?$) {
            set $no_cache 1;
        }
        if ($uri ~* \.(?:html|json)$) {
            set $no_cache 1;
        }
        if ($no_cache = 1) {
            add_header Cache-Control "no-store,no-cache";
            add_header Pragma "no-cache";
        }

        set $upstream_frontend frontend:80;
        rewrite ^/tool/pc(.*)$ /pc-tool/$1 break;
        proxy_pass   http://$upstream_frontend;
    }

    location /tool/text {
        set $no_cache 0;
        if ($uri ~* ^/tool/text[/]?$) {
            set $no_cache 1;
        }
        if ($uri ~* \.(?:html|json)$) {
            set $no_cache 1;
        }
        if ($no_cache = 1) {
            add_header Cache-Control "no-store,no-cache";
            add_header Pragma "no-cache";
        }

        set $upstream_frontend frontend:80;
        rewrite ^/tool/text(.*)$ /text-tool/$1 break;
        proxy_pass   http://$upstream_frontend;
    }

    # direct browser -> model-serving route for the tracking prototype
    # (no Java backend involved; see .omc/plans/tracking-prototype-plan.md)
    location /modelApi/ {
        set $track_upstream point-cloud-object-detection:5000;

        limit_except POST { deny all; }

        proxy_read_timeout 300s;

        rewrite ^/modelApi/(.*) /$1 break;
        proxy_pass http://$track_upstream;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        set $upstream_backend backend:8080;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass   http://$upstream_backend;
    }

    location /minio/ {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        chunked_transfer_encoding off;

        set $upstream_minio minio:9000;
        rewrite ^/minio/(.*) /$1 break;
        proxy_pass http://$upstream_minio;
    }
}
